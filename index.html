<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poptávky a objednávky — M - SILNICE a.s.</title>
<script>
  // Nastav téma co nejdřív (bez bliknutí): uložená volba, jinak systém.
  (function(){try{var t=localStorage.getItem('poptavky_theme');
    if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
  :root{--bg:#f4f6f9;--card:#ffffff;--line:#e4e8ef;--txt:#1b2430;--muted:#667488;
    --poptavka:#2563eb;--objednavka:#16a34a;--smlouva:#d97706;--accent:#2563eb;--head:#f2f5fa;--title:#f8fafc;
    --pos:#16a34a;--neg:#dc2626;--edit:#ffffff;--rucni:#f0f6ff;
    --dul-bg:#fff8e8;--chip-bg:#e6eaf0;--chip-txt:#566273;--star:#c2cbd6;--soft:#fbfcfe;--shadow:rgba(15,23,42,.05);}
  :root[data-theme="dark"]{--bg:#0f141b;--card:#1a212b;--line:#2b333f;--txt:#e6ebf2;--muted:#93a1b3;
    --poptavka:#3b82f6;--objednavka:#22c55e;--smlouva:#f59e0b;--accent:#3b82f6;--head:#212a36;--title:#1e2632;
    --pos:#22c55e;--neg:#f87171;--edit:#232c38;--rucni:#182430;
    --dul-bg:#2a2410;--chip-bg:#2b333f;--chip-txt:#aab6c5;--star:#556173;--soft:#1e2632;--shadow:rgba(0,0,0,.35);}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 1px 2px var(--shadow)}
  header h1{font-size:16px;margin:0;font-weight:700;line-height:1.2}
  header .sub{font-size:11px;color:var(--muted)} header .spacer{flex:1}
  .btn{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  a.btn{display:inline-flex;align-items:center;text-decoration:none;line-height:1}
  .btn-home{white-space:nowrap;font-weight:600}
  .btn:active{transform:translateY(1px)}
  .btn-add{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .ctrl{background:var(--edit);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 12px;font-size:14px}
  #search{flex:1;min-width:160px;max-width:300px}
  .wrap{padding:12px 14px 60px;max-width:1280px;margin:0 auto}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
  .split{display:flex;gap:14px;align-items:flex-start}
  .sidebar{width:300px;flex:0 0 300px;display:flex;flex-direction:column;gap:6px;position:sticky;top:62px;max-height:calc(100vh - 90px);overflow-y:auto}
  .detail{flex:1;min-width:0}
  .sitem{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--txt);width:100%;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .sitem:hover{border-color:var(--accent)}
  .sitem.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);background:var(--title)}
  .sitem .snm{font-size:13px;font-weight:700;line-height:1.25}
  .sitem .smeta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;color:#fff}
  .backbtn{display:none;margin-bottom:10px}
  @media(max-width:760px){
    .sidebar{width:100%;flex:1 1 auto;position:static;max-height:none}
    .split.show-detail .sidebar{display:none}
    .split:not(.show-detail) .detail{display:none}
    .backbtn{display:inline-block}
  }
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--edit);color:var(--muted);border:0;padding:8px 12px;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff;font-weight:700}
  .badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:700;color:#fff}
  .b-pop{background:var(--poptavka)} .b-obj{background:var(--objednavka)} .b-sml{background:var(--smlouva)} .b-akc{background:#7c3aed}
  .schip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
  .st-green{background:#16a34a;color:#fff} .st-amber{background:#d97706;color:#fff} .st-blue{background:#2563eb;color:#fff} .st-gray{background:var(--chip-bg);color:var(--chip-txt)}
  .st-akc{background:#7c3aed;color:#fff}
  .st-sml{background:var(--smlouva);color:#fff}
  .seg.multi button.on{background:var(--accent);color:#fff;font-weight:700}
  .stavba{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .stavba .title{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--title);display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .stavba .title .nazev{font-size:18px;font-weight:800;letter-spacing:.4px}
  .stavba .title .info{font-size:12px;color:var(--muted);margin-top:3px}
  .stavba .title .spc{flex:1}
  .cislo{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .cislo b{color:var(--txt)}
  .tbl-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:1060px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;text-align:left}
  th:last-child,td:last-child{border-right:none}
  thead th{font-size:11px;color:var(--muted);background:var(--head);text-align:center;font-weight:700}
  thead tr.grp th{text-transform:uppercase;letter-spacing:.5px}
  td.komodita{font-weight:700}
  td.c{text-align:center} td.cena{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.pozn{color:var(--muted);font-size:12px;min-width:160px}
  .uspora-pos{color:var(--pos)} .uspora-neg{color:var(--neg)}
  tr:last-child td{border-bottom:none}
  tr.mrow td{background:var(--rucni)}
  .zm{font-size:10px;color:var(--muted);font-weight:400;margin-top:2px}
  .rowbtn{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--txt);cursor:pointer;font-size:12px;padding:2px 6px;margin-right:4px}
  .rowbtn.del{color:var(--neg);border-color:transparent}
  .rowbtn.star{border-color:transparent;color:var(--star);font-size:15px} .rowbtn.star:hover{color:#e0a52e} .rowbtn.star.on{color:#e0a52e}
  tr.dulezite td{background:var(--dul-bg)} tr.dulezite td:first-child{box-shadow:inset 3px 0 0 #e0a52e}
  #f-dul.on{background:#e0a52e;border-color:#e0a52e;color:#241a05;font-weight:700}
  #f-arch.on{background:#475569;border-color:#475569;color:#fff;font-weight:700}
  .archtag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--chip-bg);color:var(--chip-txt);vertical-align:middle;letter-spacing:0}
  .empty{color:var(--muted);font-size:13px;padding:14px}
  /* modal */
  #modal,#smodal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
  .smeta2{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  .smeta2 b{color:var(--txt)}
  .term-late{color:var(--neg);font-weight:700} .term-soon{color:var(--smlouva);font-weight:700}
  .mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:18px}
  .mbox h3{margin:0 0 12px;font-size:17px}
  .mbox label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  .mbox input,.mbox select,.mbox textarea{width:100%;background:var(--edit);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px}
  .mbox textarea{min-height:54px;resize:vertical}
  .mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .mbtns .save{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
  #gate .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:340px}
  #gate h2{margin:0 0 4px;font-size:18px} #gate p{margin:0 0 16px;color:var(--muted);font-size:13px}
  #gate input{width:100%;padding:11px 12px;margin-bottom:10px;border-radius:9px;border:1px solid var(--line);background:var(--edit);color:var(--txt);font-size:15px}
  #gate .btn{width:100%;background:var(--accent);border-color:var(--accent);font-weight:700;padding:11px}
  #gate .err{color:#f87171;font-size:12px;min-height:16px;margin-top:6px;word-break:break-word}
  .hidden{display:none!important}
  .demo-bar{background:#7c3a02;color:#ffd9a8;font-size:12px;text-align:center;padding:6px}
  .viewtabs{display:flex;gap:6px;margin:2px 0 12px;flex-wrap:wrap}
  .vtab{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
  .vtab:hover{border-color:var(--accent)}
  .vtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .zblok{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--soft)}
  .zbts{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .zbts .zbacts{margin-left:auto;display:flex;gap:4px}
  .zbtext{white-space:pre-wrap;font-size:13.5px;line-height:1.55;word-break:break-word}
  .zadd-wrap{padding:14px}
  /* zápisy z porad (sekce = stavby) */
  .por-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .por-h{font-size:17px;font-weight:800;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .por-sub{font-size:12px;font-weight:400;color:var(--muted)}
  .por-tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .por-priocnt{color:#b45309}
  #por-prio.on{background:#fee2e2;border-color:#f59e0b;color:#92400e;font-weight:700}
  .por-sortsel{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--edit);color:var(--txt)}
  .por-empty{color:var(--muted);font-size:13.5px;line-height:1.6;background:var(--edit);border:1px dashed var(--line);border-radius:12px;padding:18px}
  .porada{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin-bottom:12px;background:var(--card)}
  .porada.pnew{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent);background:var(--rucni)}
  .porada.pold{opacity:.95}
  .por-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .por-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  .pnew .por-dot{background:var(--accent)}
  .por-datum{font-weight:800;font-size:14px;border:1px solid transparent;border-radius:6px;padding:2px 6px;background:transparent;color:var(--txt);width:108px}
  .por-datum:hover,.por-datum:focus{border-color:var(--line);outline:none;background:var(--card)}
  .por-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--accent);padding:2px 7px;border-radius:999px}
  .por-spc{flex:1}
  .por-x{background:none;border:1px solid transparent;color:var(--muted);font-size:11.5px;cursor:pointer;border-radius:6px;padding:2px 7px}
  .por-x:hover{color:var(--neg);border-color:var(--line)}
  .por-carry{background:var(--edit);border:1px solid var(--line);color:var(--accent);font-size:11.5px;font-weight:600;cursor:pointer;border-radius:7px;padding:3px 9px}
  .por-carry:hover{background:#e7eefc}
  .psek{margin:2px 0 4px;padding:4px 0 6px;border-top:1px dashed var(--line)}
  .psek:first-of-type{border-top:none}
  .psek-head{display:flex;align-items:center;gap:6px;margin:4px 0 2px;flex-wrap:wrap}
  .psek-akce{flex:1;min-width:140px;font-weight:800;font-size:13.5px;border:1px solid transparent;border-radius:6px;padding:3px 6px;background:transparent;color:var(--txt)}
  .psek-akce:hover,.psek-akce:focus{border-color:var(--line);outline:none;background:var(--card)}
  .psek-akce::placeholder{color:var(--muted);font-weight:600}
  .psek-x{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 6px;border-radius:6px;visibility:hidden}
  .psek:hover .psek-x{visibility:visible} .psek-x:hover{color:var(--neg)}
  .psek-hint{font-size:10.5px;color:var(--muted);background:var(--edit);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .psek-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .psek-pick{font-size:12px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:var(--card);color:var(--txt);max-width:240px}
  .psek-add{background:none;border:1px dashed var(--line);color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;border-radius:7px;padding:5px 11px}
  .psek-add:hover{background:var(--edit)}
  .pflag{flex:0 0 auto;background:none;border:none;color:#cfd5dd;cursor:pointer;font-size:14px;padding:2px 5px;border-radius:6px;line-height:1;margin-top:1px}
  .pflag:hover{color:#f59e0b} .pflag.on{color:#dc2626}
  .pup{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--accent);cursor:pointer;font-size:12px;padding:1px 6px;border-radius:6px;margin-top:1px}
  .pup:hover{background:#e7eefc}
  .pbod{display:flex;align-items:flex-start;gap:8px;padding:3px 0}
  .pbod.prio{background:var(--dul-bg);border-radius:7px}
  .pbod.prio .ptxt{font-weight:600}
  .pchk{flex:0 0 auto;width:20px;height:20px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;font-size:12px;color:#fff;line-height:1;margin-top:2px}
  .pbod.done .pchk{background:#16a34a;border-color:#16a34a}
  .ptxt{flex:1;font-size:13.5px;line-height:1.5;padding:2px 4px;border-radius:6px;min-height:22px;color:var(--txt);white-space:pre-wrap;word-break:break-word}
  .ptxt:focus{outline:none;background:var(--edit);box-shadow:inset 0 0 0 1px var(--line)}
  .ptxt:empty:before{content:attr(placeholder);color:var(--muted)}
  .pbod.done .ptxt{text-decoration:line-through;color:var(--muted)}
  .pbx{flex:0 0 auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 5px;border-radius:6px;visibility:hidden}
  .pbod:hover .pbx{visibility:visible} .pbx:hover{color:var(--neg)}
  .por-none{font-size:12px;color:var(--muted);padding:3px 0 3px 28px}
  .pbod-add{margin:6px 0 0 28px;background:none;border:1px dashed var(--line);color:var(--muted);font-size:12px;cursor:pointer;border-radius:7px;padding:4px 10px}
  .pbod-add:hover{background:var(--edit);color:var(--txt)}
  /* ===== verze + Zápisy z porad (nový jednoduchý model) ===== */
  .appver{font-size:11px;font-weight:600;color:var(--muted);vertical-align:middle;letter-spacing:.02em}
  .zk-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:2px 0 14px}
  .zk-h{font-size:17px;font-weight:800}
  .zk-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .zk-tab{background:var(--card);color:var(--muted);border:0;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer}
  .zk-tab.on{background:var(--accent);color:#fff}
  .zk-add{display:flex;gap:8px;margin-bottom:14px}
  .zk-add input{flex:1;background:var(--edit);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px}
  .zk-grp{margin-bottom:16px}
  .zk-grp-d{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px 2px}
  .zk-row{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px}
  .zk-row.done .zk-txt{text-decoration:line-through;color:var(--muted)}
  .zk-row.pozn{background:var(--soft)}
  .zk-chk{flex:0 0 auto;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;background:transparent;color:#fff;font-size:15px;font-weight:800;cursor:pointer;line-height:20px;padding:0}
  .zk-row.done .zk-chk{border-color:var(--objednavka);background:var(--objednavka)}
  .zk-chk:disabled{opacity:.45;cursor:default}
  .zk-bullet{flex:0 0 auto;width:24px;height:24px;border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;line-height:20px;padding:0}
  .zk-txt{flex:1;font-size:15px;line-height:1.45;min-height:22px;outline:none;word-break:break-word;white-space:pre-wrap}
  .zk-txt[contenteditable]:focus{box-shadow:0 2px 0 -1px var(--accent)}
  .zk-flip,.zk-x{flex:0 0 auto;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:6px;line-height:1.3}
  .zk-flip:hover,.zk-x:hover{background:var(--edit);color:var(--txt)}
  .zk-foot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .zk-del{color:var(--neg);border-color:var(--neg)}
  .zk-empty{color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:12px;line-height:1.55}
  .zk-arch-top{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .zk-card{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;margin-bottom:14px;box-shadow:0 1px 3px var(--shadow)}
  .zk-card.new{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  .zk-card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .zk-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto}
  .zk-datum{border:1px solid var(--line);background:var(--edit);color:var(--txt);border-radius:8px;padding:6px 9px;font-size:14px;font-weight:700;width:118px}
  .zk-newtag{font-size:10px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px}
  .zk-oldtag{font-size:10px;font-weight:700;color:var(--chip-txt);background:var(--chip-bg);border-radius:999px;padding:2px 8px}
  .zk-spc{flex:1}
  .zk-cardx{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
  .zk-cardx:hover{border-color:var(--neg);color:var(--neg)}
  .zk-rows{margin-top:2px}
  .zk-card-add{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .zk-sm{padding:6px 11px;font-size:13px}
  .zk-none{color:var(--muted);font-size:13px;padding:6px 2px}
</style>
</head>
<body>

<div id="gate"><div class="box">
  <h2>Poptávky a objednávky</h2><p>M - SILNICE a.s. · OZ Jih — přihlášení</p>
  <input id="g-email" type="email" placeholder="e-mail" autocomplete="username">
  <input id="g-pass" type="password" placeholder="heslo" autocomplete="current-password">
  <button class="btn" id="g-login">Přihlásit</button><div class="err" id="g-err"></div>
</div></div>

<div id="demo" class="demo-bar hidden">UKÁZKOVÝ REŽIM — data jsou demo, změny se neukládají.</div>

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function isPlaceholder(){return !FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.indexOf('PLACEHOLDER')!==-1;}
var DEMO_MODE=isPlaceholder()||/[?&]demo/.test(location.search)||location.hostname==='localhost'||location.hostname==='127.0.0.1';

var DATA={meta:{},stavby:[],poznamky:{},upravy:{},rucni:{},stavby_extra:{},dulezite:{},porady:{}};
var FILTER={q:'',stavba:'',typ:{pop:1,obj:1,sml:1,akc:1},stav:'all',sort:'',dulezite:false,archiv:false,pripravar:'',stavbyvedouci:''};
var VIEW='stavby',SEKCE_SORT='poradi',PRIO_ONLY=false,SKRYT_VYRESENE=false,ZVIEW='ukoly',SHOW_DONE=false,APP_VERSION='2.0';
var db=null,auth=null,started=false,CTX=null;
var FIELDS=['komodita','typ','kolo1','kolo2','kolo3','vitez','zasmluvneni','objednano','cenaNakladova','cenaVysoutezena','poznamka','stav'];

function fmtNum(v){if(v===''||v==null)return '';var n=(typeof v==='number')?v:parseFloat(String(v).replace(/\s/g,'').replace(',','.'));if(isNaN(n))return esc(v);return n.toLocaleString('cs-CZ',{minimumFractionDigits:0,maximumFractionDigits:2});}
function toNum(v){var n=(typeof v==='number')?v:parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?null:n;}
function slug(s){return String(s).replace(/[„“”]/g,'').replace(/[.$#\[\]\/\x00-\x1f]+/g,'_').replace(/\s+/g,'_').slice(0,180);}
function rowKey(nazev,komodita){return (slug(nazev)+'__'+slug(komodita)).slice(0,200);}
function typKind(p){var t=(p.typ||'').toUpperCase(),z=(p.zasmluvneni||'').toLowerCase(),st=(p.stav||'').toLowerCase();
  if(z.indexOf('akcept')!==-1||st.indexOf('akcept')!==-1||t.indexOf('AKCEPT')!==-1)return 'akc';
  if(t.indexOf('SMLOU')===0||z.indexOf('smlouv')!==-1||z.indexOf('rs')!==-1)return 'sml';
  if(t.indexOf('OBJ')===0||z.indexOf('obj')!==-1||(p.objednano||'').toUpperCase().indexOf('ANO')===0)return 'obj';
  return 'pop';}
function badgeHtml(p){var k=typKind(p),m={pop:['b-pop','POP'],obj:['b-obj','OBJ'],sml:['b-sml','SML'],akc:['b-akc','AKCEPT']}[k];return '<span class="badge '+m[0]+'">'+m[1]+'</span>';}
function stavDefault(p){if(p.stav&&String(p.stav).trim())return String(p.stav).trim();if((p.objednano||'').toUpperCase().indexOf('ANO')===0)return 'Objednáno';var z=(p.zasmluvneni||'').toLowerCase();if(z.indexOf('smlouv')!==-1)return 'Zasmluvněno';if(z.indexOf('akcept')!==-1)return 'Akceptováno';if(p.vitez&&String(p.vitez).trim())return 'Vybráno';return 'Poptáno';}
function stavClass(s){var t=(s||'').toLowerCase();if(/akcept/.test(t))return 'st-akc';if(/zasmluvn/.test(t))return 'st-sml';if(/hotov|dokon|objedn|podeps|uzav/.test(t))return 'st-green';if(/p[řr]ipom[ií]n|[čc]ek|podpis|jedn[áa]|[řr]e[šs][ií]|rozjedn/.test(t))return 'st-amber';if(/popt|v[ýy]b[ěe]r|cn|nab[ií]dk/.test(t))return 'st-blue';return 'st-gray';}
function koloText(p){var ks=[p.kolo1,p.kolo2,p.kolo3],out=[];for(var i=0;i<3;i++){var v=ks[i];if(v!=null&&String(v).trim()!=='')out.push((i+1)+'. <b>'+esc(String(v).trim())+'</b>');}return out.join('<br>');}
function exOf(sl){return (DATA.stavby_extra&&DATA.stavby_extra[sl])||{};}
function origNazev(sl){var o='';(DATA.stavby||[]).forEach(function(s){if(slug(s.nazev)===sl)o=s.nazev;});return o;}
function displayName(s){var ex=exOf(slug(s.nazev));return (ex.nazev&&String(ex.nazev).trim())?String(ex.nazev).trim():(s.nazev||'').replace(/[„“”]/g,'').trim();}
function fmtDate(iso){if(!iso)return '';var p=String(iso).split('-');return p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):String(iso);}
function daysTo(iso){if(!iso)return null;var d=new Date(String(iso)+'T00:00:00');if(isNaN(d.getTime()))return null;var n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/86400000);}
function dleft(iso){var n=daysTo(iso);if(n==null)return '';if(n<0)return ' (po termínu '+(-n)+' dní)';if(n===0)return ' (dnes)';return ' (za '+n+' dní)';}
function eff(nazev,p0){var k=rowKey(nazev,p0.komodita),ov=(DATA.upravy&&DATA.upravy[k])?DATA.upravy[k]:{},o={_zmeneno:ov._zmeneno||'',_kdo:ov._kdo||''};
  FIELDS.forEach(function(f){o[f]=(f in ov)?ov[f]:(p0[f]!=null?p0[f]:'');});return o;}
function nowStr(){var d=new Date();function p(n){return (n<10?'0':'')+n;}return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());}
function whoNow(){return (auth&&auth.currentUser&&auth.currentUser.email)?auth.currentUser.email:'';}

function buildStavbaFilter(){var sel=$('f-stavba'),cur=sel.value,opts='<option value="">Všechny stavby</option>';
  (DATA.stavby||[]).forEach(function(s){var nm=(s.nazev||'').replace(/[„“”]/g,'').trim();var c=cisloOf(slug(s.nazev));opts+='<option value="'+esc(slug(s.nazev))+'">'+esc(nm)+(c?' ('+esc(c)+')':'')+'</option>';});
  sel.innerHTML=opts; sel.value=cur;}
function cisloOf(sl){return (DATA.stavby_extra&&DATA.stavby_extra[sl]&&DATA.stavby_extra[sl].cislo)?DATA.stavby_extra[sl].cislo:'';}
function isArchived(sl){return !!(exOf(sl).archiv);}
function setArchived(sl,val){DATA.stavby_extra=DATA.stavby_extra||{};DATA.stavby_extra[sl]=DATA.stavby_extra[sl]||{};if(val){DATA.stavby_extra[sl].archiv=true;if(db)db.ref('/stavby_extra/'+sl+'/archiv').set(true);}else{delete DATA.stavby_extra[sl].archiv;if(db)db.ref('/stavby_extra/'+sl+'/archiv').remove();}if(!db)render();}
function distinctExtra(field){var set={},ex=DATA.stavby_extra||{};Object.keys(ex).forEach(function(k){var v=((ex[k]&&ex[k][field])||'').toString().trim();if(v)set[v]=1;});return Object.keys(set).sort(function(a,b){return a.localeCompare(b,'cs');});}
function buildPeopleFilters(){[['f-prip','pripravar','Přípravář','priplist'],['f-svd','stavbyvedouci','Stavbyvedoucí','svdlist']].forEach(function(d){
  var vals=distinctExtra(d[1]);
  var sel=$(d[0]);if(sel){var cur=sel.value,o='<option value="">'+d[2]+': všichni</option>';vals.forEach(function(v){o+='<option value="'+esc(v)+'">'+esc(v)+'</option>';});sel.innerHTML=o;sel.value=cur;}
  var dl=$(d[3]);if(dl){dl.innerHTML=vals.map(function(v){return '<option value="'+esc(v)+'">';}).join('');}
});}
function passFilter(nazev,p,cislo){var kind=typKind(p);
  if(!FILTER.typ[kind])return false;
  var jeObj=(String(p.objednano||'').toUpperCase().indexOf('ANO')===0);
  if(FILTER.stav==='obj'&&!jeObj)return false; if(FILTER.stav==='ceka'&&jeObj)return false;
  var q=FILTER.q.trim().toLowerCase();
  if(q && (nazev+' '+(cislo||'')+' '+(p.komodita||'')+' '+(p.vitez||'')+' '+(p.poznamka||'')).toLowerCase().indexOf(q)===-1)return false;
  return true;}
function uspora(p){var nN=toNum(p.cenaNakladova),nV=toNum(p.cenaVysoutezena);if(nN!=null&&nV!=null){var d=nN-nV;return '<span class="'+(d>=0?'uspora-pos':'uspora-neg')+'">'+fmtNum(d)+'</span>';}return '';}

function rowTr(mode,idkey,nazev,p,zm){
  var key=rowKey(nazev,p.komodita);
  var dul=!!(DATA.dulezite&&DATA.dulezite[key]);
  if(FILTER.dulezite&&!dul)return '';
  var note=(DATA.poznamky&&DATA.poznamky[key])?DATA.poznamky[key]:'';
  var star='<button class="rowbtn star'+(dul?' on':'')+'" data-star="'+esc(key)+'" title="'+(dul?'důležité – klikni pro zrušení':'označit jako důležité')+'">'+(dul?'⚑':'⚐')+'</button>';
  var btns=star+'<button class="rowbtn" data-ed="'+mode+'|'+esc(idkey)+'" title="upravit">✏️</button>'+(mode==='r'?'<button class="rowbtn del" data-del="'+esc(idkey)+'" title="smazat">✕</button>':'');
  var zmh=zm?'<div class="zm">změněno '+esc(zm)+'</div>':'';
  return '<tr class="'+(mode==='r'?'mrow ':'')+(dul?'dulezite':'')+'"><td class="komodita">'+btns+' '+badgeHtml(p)+' '+esc(p.komodita)+zmh+'</td>'
    +'<td class="c">'+koloText(p)+'</td>'
    +'<td class="c">'+esc(p.vitez)+'</td><td class="c">'+esc(p.zasmluvneni)+'</td>'
    +'<td class="cena">'+fmtNum(p.cenaVysoutezena)+'</td>'
    +'<td class="c"><span class="schip '+stavClass(stavDefault(p))+'">'+esc(stavDefault(p))+'</span></td>'
    +'<td class="pozn">'+esc(p.poznamka)+(note?'<div class="zm">📝 '+esc(note)+'</div>':'')+'</td></tr>';
}

function render(){
  buildPeopleFilters();
  var stavbyList=(DATA.stavby||[]).slice();
  if(FILTER.sort==='cislo-asc'||FILTER.sort==='cislo-desc'){stavbyList.sort(function(a,b){return String(cisloOf(slug(a.nazev))).localeCompare(String(cisloOf(slug(b.nazev))),'cs',{numeric:true});});if(FILTER.sort==='cislo-desc')stavbyList.reverse();}
  else if(FILTER.sort==='abc-asc'||FILTER.sort==='abc-desc'){stavbyList.sort(function(a,b){return String(a.nazev||'').localeCompare(String(b.nazev||''),'cs');});if(FILTER.sort==='abc-desc')stavbyList.reverse();}
  var searching=FILTER.q.trim()!=='';
  var vis=[];
  stavbyList.forEach(function(s){
    var sl=slug(s.nazev);if(isArchived(sl)!==FILTER.archiv)return;
    if(FILTER.pripravar&&((exOf(sl).pripravar||'').toString().trim()!==FILTER.pripravar))return;
    if(FILTER.stavbyvedouci&&((exOf(sl).stavbyvedouci||'').toString().trim()!==FILTER.stavbyvedouci))return;
    var cislo=cisloOf(sl),items=[],mk={};
    (s.polozky||[]).forEach(function(p0){var p=eff(s.nazev,p0);mk[(p.komodita||'').toLowerCase()]=1;items.push({p:p,mode:'m',idkey:rowKey(s.nazev,p0.komodita)});});
    var rmap=(DATA.rucni&&DATA.rucni[sl])?DATA.rucni[sl]:{};
    Object.keys(rmap).forEach(function(id){var p=rmap[id]||{};if(mk[(p.komodita||'').toLowerCase()])return;items.push({p:p,mode:'r',idkey:sl+'|'+id});});
    var matched=items.filter(function(it){return passFilter(s.nazev,it.p,cislo);});
    if(searching && matched.length===0)return;
    vis.push({s:s,sl:sl,cislo:cislo,items:items,matched:matched});
  });
  if(vis.length && !vis.some(function(v){return v.sl===FILTER.stavba;}))FILTER.stavba=vis[0].sl;
  // seznam staveb vlevo
  var side='';
  vis.forEach(function(v){
    var nm=displayName(v.s), on=(v.sl===FILTER.stavba);
    var pop=0,obj=0,sml=0,akc=0;v.items.forEach(function(it){var k=typKind(it.p);if(k==='obj')obj++;else if(k==='sml')sml++;else if(k==='akc')akc++;else pop++;});
    var meta='';
    if(v.cislo)meta+='<span>č.'+esc(v.cislo)+'</span>';
    meta+='<span>'+(searching?(v.matched.length+' shod'):(v.items.length+' pol.'))+'</span>';
    if(pop)meta+='<span class="pill b-pop" title="poptávky">'+pop+'</span>';
    if(obj)meta+='<span class="pill b-obj" title="objednávky">'+obj+'</span>';
    if(sml)meta+='<span class="pill b-sml" title="smlouvy">'+sml+'</span>';
    if(akc)meta+='<span class="pill b-akc" title="akceptace">'+akc+'</span>';
    side+='<button class="sitem'+(on?' on':'')+'" data-sid="'+esc(v.sl)+'"><div class="snm">'+esc(nm)+'</div><div class="smeta">'+meta+'</div></button>';
  });
  $('sidebar').innerHTML=side||'<div class="empty">'+(FILTER.archiv?'Archiv je prázdný.':'Žádná stavba.')+'</div>';
  // detail vybrané stavby vpravo
  var sel=null;vis.forEach(function(v){if(v.sl===FILTER.stavba)sel=v;});
  var detail='';
  if(sel){
    var rows='';sel.matched.forEach(function(it){rows+=rowTr(it.mode,it.idkey,sel.s.nazev,it.p,it.p._zmeneno);});
    var ex=exOf(sel.sl),m2='';
    if(sel.cislo)m2+='<span>č. <b>'+esc(sel.cislo)+'</b></span>';
    if(ex.investor)m2+='<span>Investor: <b>'+esc(ex.investor)+'</b></span>';
    if(ex.pripravar)m2+='<span>Přípravář: <b>'+esc(ex.pripravar)+'</b></span>';
    if(ex.stavbyvedouci)m2+='<span>Stavbyvedoucí: <b>'+esc(ex.stavbyvedouci)+'</b></span>';
    if(ex.predani)m2+='<span>Předání: <b>'+esc(fmtDate(ex.predani))+'</b></span>';
    if(ex.dokonceni){var dd=daysTo(ex.dokonceni);m2+='<span class="'+(dd!=null&&dd<0?'term-late':(dd!=null&&dd<=14?'term-soon':''))+'">Dokončení: <b>'+esc(fmtDate(ex.dokonceni))+'</b>'+esc(dleft(ex.dokonceni))+'</span>';}
    if(ex.uzivani){var du=daysTo(ex.uzivani);m2+='<span class="'+(du!=null&&du<0?'term-late':(du!=null&&du<=14?'term-soon':''))+'">Předč. užívání: <b>'+esc(fmtDate(ex.uzivani))+'</b>'+esc(dleft(ex.uzivani))+'</span>';}
    detail='<button class="btn backbtn" id="backbtn">← Stavby</button>'
      +'<div class="stavba"><div class="title"><div style="flex:1;min-width:0"><div class="nazev">'+esc(displayName(sel.s))+(isArchived(sel.sl)?' <span class="archtag">📦 archiv</span>':'')+'</div>'+(sel.s.info?'<div class="info">'+esc(sel.s.info)+'</div>':'')+(m2?'<div class="smeta2">'+m2+'</div>':'')+'</div>'
      +'<button class="btn" data-stedit="'+esc(sel.sl)+'">✏️ Stavba</button>'
      +'<button class="btn" data-arch="'+esc(sel.sl)+'">'+(isArchived(sel.sl)?'↩︎ Vrátit z archivu':'📦 Do archivu')+'</button>'

$('detail').addEventListener('click',function(e){
  if(e.target.closest('#backbtn')){$('split').classList.remove('show-detail');return;}
  var se=e.target.closest('[data-stedit]'); if(se){openStavbaEdit(se.getAttribute('data-stedit'));return;}
  var ed=e.target.closest('[data-ed]'); if(ed){var pr=ed.getAttribute('data-ed').split('|');openEdit(pr[0],pr.slice(1).join('|'));return;}
  var ad=e.target.closest('[data-add]'); if(ad){openNew(ad.getAttribute('data-add'));return;}
  var dl=e.target.closest('[data-del]'); if(dl){if(confirm('Smazat tento řádek?'))delRow(dl.getAttribute('data-del'));return;}
  var ci=e.target.closest('[data-cislo]'); if(ci){editCislo(ci.getAttribute('data-cislo'));return;}
  var st=e.target.closest('[data-star]'); if(st){toggleDul(st.getAttribute('data-star'));return;}
  var arb=e.target.closest('[data-arch]'); if(arb){toggleArchiv(arb.getAttribute('data-arch'));return;}
});
function toggleArchiv(sl){setArchived(sl,!isArchived(sl));}
function toggleDul(key){DATA.dulezite=DATA.dulezite||{};if(DATA.dulezite[key]){delete DATA.dulezite[key];if(db)db.ref('/dulezite/'+key).remove();else render();}else{DATA.dulezite[key]=true;if(db)db.ref('/dulezite/'+key).set(true);else render();}}
$('f-dul').addEventListener('click',function(){FILTER.dulezite=!FILTER.dulezite;this.classList.toggle('on',FILTER.dulezite);render();});
$('f-arch').addEventListener('click',function(){FILTER.archiv=!FILTER.archiv;FILTER.stavba='';render();});
$('f-prip').addEventListener('change',function(){FILTER.pripravar=this.value;FILTER.stavba='';render();});
$('f-svd').addEventListener('change',function(){FILTER.stavbyvedouci=this.value;FILTER.stavba='';render();});
$('m-cancel').addEventListener('click',closeModal);
$('m-save').addEventListener('click',saveModal);
$('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
var SCTX=null;
function openStavbaEdit(sl){SCTX={sl:sl};var ex=exOf(sl);$('s-nazev').value=(ex.nazev&&String(ex.nazev).trim())?ex.nazev:(origNazev(sl)||'').replace(/[„“”]/g,'').trim();$('s-investor').value=ex.investor||'';$('s-cislo').value=ex.cislo||'';$('s-pripravar').value=ex.pripravar||'';$('s-stavbyvedouci').value=ex.stavbyvedouci||'';$('s-predani').value=ex.predani||'';$('s-dokonceni').value=ex.dokonceni||'';$('s-uzivani').value=ex.uzivani||'';$('smodal').classList.remove('hidden');}
function saveStavbaEdit(){if(!SCTX)return;var sl=SCTX.sl;var o={nazev:$('s-nazev').value.trim(),investor:$('s-investor').value.trim(),cislo:$('s-cislo').value.trim(),pripravar:$('s-pripravar').value.trim(),stavbyvedouci:$('s-stavbyvedouci').value.trim(),predani:$('s-predani').value,dokonceni:$('s-dokonceni').value,uzivani:$('s-uzivani').value};DATA.stavby_extra=DATA.stavby_extra||{};DATA.stavby_extra[sl]=Object.assign(DATA.stavby_extra[sl]||{},o);if(db)db.ref('/stavby_extra/'+sl).update(o);$('smodal').classList.add('hidden');SCTX=null;if(!db)render();}
$('s-cancel').addEventListener('click',function(){$('smodal').classList.add('hidden');SCTX=null;});
$('s-save').addEventListener('click',saveStavbaEdit);
$('smodal').addEventListener('click',function(e){if(e.target===this){this.classList.add('hidden');SCTX=null;}});

// --- Světlý/tmavý režim ---
function applyThemeIcon(){var t=document.documentElement.getAttribute('data-theme')||'light';var b=$('theme');if(b){b.textContent=(t==='dark')?'☀️':'🌙';b.title=(t==='dark')?'Přepnout na světlý režim':'Přepnout na tmavý režim';}}
function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme')||'light';var next=(cur==='dark')?'light':'dark';document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('poptavky_theme',next);}catch(e){}applyThemeIcon();}
if($('theme'))$('theme').addEventListener('click',toggleTheme);
applyThemeIcon();

function startApp(){if(started)return;started=true;showApp();try{db.ref('/').on('value',function(snap){DATA=normalize(snap.val()||{});render();renderPorady();},function(){});}catch(e){}}
if(DEMO_MODE){$('demo').classList.remove('hidden');DATA=DEMO;DATA.poznamky={};DATA.upravy={};DATA.rucni={};DATA.stavby_extra={};DATA.porady={};showApp();$('logout').classList.add('hidden');}
else{
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.database();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){});
  $('g-login').addEventListener('click',function(){$('g-err').textContent='';var e=$('g-email').value.trim(),p=$('g-pass').value;
    if(!e||!p){$('g-err').textContent='Vyplň e-mail i heslo.';return;}$('g-login').textContent='Přihlašuji…';
    auth.signInWithEmailAndPassword(e,p).then(function(){startApp();}).catch(function(err){$('g-login').textContent='Přihlásit';$('g-err').textContent='Chyba: '+(err&&err.code?err.code:'')+' '+(err&&err.message?err.message:'');});});
  $('g-pass').addEventListener('keydown',function(ev){if(ev.key==='Enter')$('g-login').click();});
  $('logout').addEventListener('click',function(){started=false;auth.signOut();});
  auth.onAuthStateChanged(function(user){if(user){startApp();}else{started=false;$('gate').classList.remove('hidden');$('topbar').classList.add('hidden');$('app').classList.add('hidden');$('g-login').textContent='Přihlásit';}});
}
</script>
</body>
